[tool.poetry]
name = "alexa_media_player"
version = "5.7.11"
description = "This is a custom component to allow control of Amazon Alexa devices in [Homeassistant](https://home-assistant.io) using the unofficial Alexa API."
authors = [
  "Keaton Taylor <keatonstaylor@gmail.com>",
  "Alan D. Tse <alandtse@gmail.com>",
]
license = "Apache-2.0"
packages = [
    { include = "custom_components/alexa_media" }
]

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
alexapy = "1.29.9"
aiohttp = ">=3.8.1"
packaging = ">=20.3"
wrapt = ">=1.12.1"

[tool.poetry.group.dev.dependencies]
homeassistant = ">=2025.2.0"
pytest-homeassistant-custom-component = ">=0.13.107"
pre-commit = ">=2.11.1"
prospector = { extras = ["with_all"], version = ">=1.8.3" }
pytest-cov = "*"
safety = ">=3.2.9"
pytest = ">6.2.2"
codespell = ">2.0.0"
yamllint = ">1.26.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.semantic_release]
version_toml = [
  "pyproject.toml:tool.poetry.version"
]
version_variables = [
  "custom_components/alexa_media/const.py:VERSION",
  "custom_components/alexa_media/manifest.json:version"
]
upload_to_pypi = false
upload_to_release = false
changelog_sections = "feature,fix,breaking,documentation,performance,refactor"
build_command = "echo"
branch = "main"
commit_subject = "[skip ci] {version}"

[tool.ruff]
line-length = 88
target-version = 'py313'
exclude = ["docs/"]

[tool.ruff.lint]
select = [
    "F",    # Pyflakes (replaces flake8's core)
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "PL",   # Pylint rules
    "RUF",  # Ruff-specific rules
]
ignore = [
    "PLR0913",  # Too many arguments
    "PLR2004", # Magic value
    "RUF012", # Mutable class attributes
    "PLR0912",  # Too many branches
    "E501",  # line too long
    "PLR0911",  # Too many return statements
    "RUF006", # Store reference to async tasks
    "SIM103", # Return the negated condition directly
]
exclude = ["docs/"]

[tool.mypy]
python_version = "3.13"
ignore_errors = true
follow_imports = "silent"
ignore_missing_imports = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
explicit_package_bases = true

[tool.codespell]
skip = './.*,*.csv,*.json,*.lock'
quiet-level = 2
ignore-words-list = "hass"

[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.bandit]
skips = ["B101", "B404", "B603"]
